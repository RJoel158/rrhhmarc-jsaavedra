services:
  # ========================================================
  # 1. SERVICIO DE BASE DE DATOS (PostgreSQL)
  # ========================================================
  database:
    image: postgres:16-alpine
    container_name: rrhh_database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-rrhh}
      POSTGRES_USER: ${DB_USER:-rrhh_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rrhh_secure_password_2026}
    volumes:
      # Volumen persistente para los datos de la base de datos
      - postgres_data:/var/lib/postgresql/data
      # Script SQL de inicialización automática al arrancar por primera vez
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - rrhh-network
    # Comprobación de estado (Healthcheck) requerida por el examen
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rrhh_user} -d ${DB_NAME:-rrhh}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ========================================================
  # 2. SERVICIO API REST (Backend Node.js + Express)
  # ========================================================
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: rrhh_api
    restart: unless-stopped
    environment:
      API_PORT: ${API_PORT:-3000}
      DB_HOST: ${DB_HOST:-database}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-rrhh}
      DB_USER: ${DB_USER:-rrhh_user}
      DB_PASSWORD: ${DB_PASSWORD:-rrhh_secure_password_2026}
    ports:
      # Expone el puerto para pruebas directas vía curl / Postman
      - "${API_PORT:-3000}:3000"
    networks:
      - rrhh-network
    # Garantiza que la API no intente operar antes de que la BD esté disponible y saludable
    depends_on:
      database:
        condition: service_healthy

  # ========================================================
  # 3. SERVICIO WEB FRONTEND (Nginx + HTML/CSS/JS)
  # ========================================================
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: rrhh_web
    restart: unless-stopped
    ports:
      # Acceso web para Recursos Humanos en el navegador
      - "${WEB_PORT:-8080}:80"
    networks:
      - rrhh-network
    depends_on:
      - api

# ========================================================
# RED PRIVADA PERSONALIZADA DE DOCKER (Bridge)
# ========================================================
networks:
  rrhh-network:
    driver: bridge

# ========================================================
# VOLUMEN PERSISTENTE
# ========================================================
volumes:
  postgres_data:
    driver: local
